<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麦克白游戏背景</title>
    <style>
        body{
            background:url(img/背景图-1.jpg);
            font-family:"楷体";
            font-size:25px;
            padding: 40px 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        #content-wrapper {
            width: 100%;
            max-width: 800px;
        }
        /* 核心修改：将透明度从0.7降至0.4，容器更通透 */
        #text{
            color: #1a1a1a;
            text-shadow: 0 0 3px rgba(255,255,255,1); /* 增强文字阴影，确保在透明背景上清晰 */
            line-height: 1.8;
            margin-bottom: 80px;
            text-align: center;
            white-space: pre-line;
            /* 透明度调整：rgba最后一位从0.7改为0.4，数值越小越透明 */
            background-color: rgba(255, 255, 255, 0.4);
            padding: 30px 20px;
            border-radius: 12px;
            backdrop-filter: blur(3px); /* 保留背景模糊，增强分层感 */
        }
        /* 标题样式优化，适配透明背景 */
        #text::first-line {
            font-size: 32px;
            font-weight: bold;
            margin: 30px 0;
            display: block;
            color: #1a365d;
            text-shadow: 0 0 2px rgba(255,255,255,0.9);
        }
        /* 以下样式不变 */
        #text::after {
            content: "|"; 
            color: #e74c3c; 
            animation: blink 0.8s infinite alternate; 
            margin-left: 5px; 
        }
        @keyframes blink {
            from { opacity: 1; } 
            to { opacity: 0; } 
        }
        a{
            display:none;
            position:fixed;
            right:0;
            bottom:0;
            margin:10px;
            font-size:20px;
            color: #e74c3c;
            text-decoration: none; 
        }
        a:hover{
            text-decoration:underline;
        }
        .bottom-jump-btn {
            display: block;
            opacity: 0;
            transition: all 0.3s ease;
            position: fixed;
            right: 30px; 
            bottom: 30px; 
            padding: 12px 24px; 
            background-color: #ffffff;
            color: #1a365d;
            border: 3px solid #1a365d;
            box-shadow: 0 0 0 2px #0f2447;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer; 
            font-weight: bold;
            -webkit-text-stroke: 1px #0f2447;
            transform-origin: center;
            z-index: 999;
        }
        .bottom-jump-btn:hover {
            background-color: #f5f5f5; 
            border-color: #0f2447;
            box-shadow: 0 0 0 2px #08182e;
            transform: translateY(-2px);
        }
        .bottom-jump-btn.clicked {
            animation: btnClick 0.5s forwards;
        }
        @keyframes btnClick {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="content-wrapper">
        <div id="text"></div>
    </div>
    <button class="bottom-jump-btn">继续</button>
    <a ></a >
    <script>
        var text = '游戏背景\n'+
                   '苏格兰国王邓肯在他最信任的将军——麦克白的城堡中离奇死亡。是突发恶疾，还是谋杀？在麦克白加冕前夜，五位决定王国命运的关键人物齐聚一堂。你们必须找出真相，决定王冠的归属。\n\n'+
                   '核心规则\n'+
                   '1. 沉浸于你的角色。\n2. 尽力完成你的公开目标和秘密任务。\n3. 你可以说谎，但必须基于你的角色动机。\n\n'+
                   '案件详情\n'+
                   '- 死者：邓肯国王\n- 案发现场：邓肯王被匕首刺穿心脏，且匕首上涂有罕见的蛇毒，导致伤口发黑、血液无法凝固。\n- 死亡时间：前夜子时至丑时（约23:00 - 1:00）\n- 死亡地点：麦克白城堡客房的床上。';
        
        var t = document.getElementById("text");
        var btn = document.querySelector("a");
        var loginBtn = document.querySelector('.bottom-jump-btn');
        var index = 0;
        function Writer() {
            if (index < text.length) {
                t.innerHTML += text[index++];
                setTimeout(Writer, 120);
            } else {
                t.style.animation = "none"; 
                const cursor = document.createElement('style');
                cursor.textContent = "#text::after { display: none; }";
                document.head.appendChild(cursor); 
                btn.style.display = "block";
                loginBtn.style.opacity = 1;
            }
        }
        Writer();
        const jumpBtn = document.querySelector('.bottom-jump-btn');
        jumpBtn.addEventListener('click', function() {
            this.classList.add('clicked');
            setTimeout(()=>{
                window.location.href = '角色信息（公开）.html';
            },500);
        });
    </script>
</body>
</html>
