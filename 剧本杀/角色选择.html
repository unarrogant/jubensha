<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>选择角色界面</title>
		<style>
			*{
				padding:0;
				margin:0;
			}
			body{
				font-family:"楷体";
				background-color: #f0e6d2;
                background-image: 
	                radial-gradient(#d9c8a7 1px, transparent 1px),
	                radial-gradient(#d9c8a7 1px, transparent 1px);
			}
			
			.nav{
				
				width:100%;
				height:40px;
				border:1px solid black;
				background:purple;
				padding-left:20px;
			}
			
			.container{
				border:1px solid black;
				display:flex;
				align-items:center;
				justify-content: space-around;
				margin-left:80px;
				width:1100px;
				height:300px;
				margin-top:100px;
				gap:200px;
				
			}
			.inner{
				border:1px solid black;
				width:20%;
				height:250px;
				position:relative;
				transform-style:preserve-3d;
				perspective:1000px;
			}
			.img{
				
				position:absolute;
				width:80%;
				height:230px;
				margin-left:40px;
				border-radius:20px;
				box-shadow:0 0 15px rgb(0,0,0);
				backface-visibility: hidden;
				transition:2s;
			}
			.p2 img{
				position:absolute;
				width:100%;
				height:100%;
				border-radius:20px;
			}
			.p2{
				transform:rotateY(180deg);
			}
			a{
				top:70%;
				left:70%;
	           
	            background-color: purple;
	            color: white;
	            padding: 10px;
	            text-decoration: none;
	            border-radius: 10px;
				position:absolute;
			}
		</style>
	</head>
	<body>
		<div class="nav">
			<h1>角色选择</h1>
		</div>
		<div class="container">
			<div class="inner">
				<img src="img/卡牌背面.jpg" alt="" class="img p1">
				<div class="img p2">
					<img src="img/马尔康.jpg" alt="" >
				    <a href="马尔康背景.html">进入</a>
				</div>
							
				
			</div>
			<div class="inner">
				<img src="img/卡牌背面.jpg" alt="" class="img p1">
				<div class="img p2">
					<img src="img/麦克德夫.jpg" alt="" >
				    <a href="麦克德夫背景.html">进入</a>
				</div>
			</div>
			<div class="inner">
				<img src="img/卡牌背面.jpg" alt="" class="img p1">
				<div class="img p2">
					<img src="img/班柯.jpg" alt="" >
				    <a href="班柯背景.html">进入</a>
				</div>
			</div>
		</div>
		<div class="container">
			<div class="inner">
				<img src="img/卡牌背面.jpg" alt="" class="img p1">
				<div class="img p2">
					<img src="img/麦克白夫人.jpg" alt="" >
				    <a href="麦克白夫人背景.html">进入</a>
				</div>
							
				
			</div>
			
			<div class="inner">
				<img src="img/卡牌背面.jpg" alt="" class="img p1">
				<div class="img p2">
					<img src="img/麦克白.jpg" alt="" >
				    <a href="麦克白背景.html">进入</a>
				</div>
			</div>
		</div>
	</body>
	<script>
		var imgs1=document.querySelectorAll(".p1");
		var imgs2=document.querySelectorAll(".p2");
		imgs1.forEach((img1,index)=>{
			img1.addEventListener("click",()=>{
				img1.style.transform="rotateY(-180deg)";
				imgs2[index].style.transform="rotateY(0deg)";
			});
		});
		imgs2.forEach((img2,index)=>{
			img2.addEventListener("click",()=>{
				imgs1[index].style.transform="rotateY(0deg)";
				img2.style.transform="rotateY(180deg)";
			});
		})
		
		
	</script>
</html>
