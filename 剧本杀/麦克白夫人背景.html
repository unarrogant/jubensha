<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麦克白夫人背景介绍</title>
    <style>
        body{
            background:url(img/背景图-1.jpg);
            font-family:"楷体";
            font-size:25px;
            padding: 40px 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        #content-wrapper {
            width: 100%;
            max-width: 800px;
        }
        /* 核心修改：将透明度从0.7降至0.4，容器更通透 */
        #text{
            color: #1a1a1a;
            text-shadow: 0 0 3px rgba(255,255,255,1); /* 增强文字阴影，确保在透明背景上清晰 */
            line-height: 1.8;
            margin-bottom: 80px;
            text-align: center;
            white-space: pre-line;
            /* 透明度调整：rgba最后一位从0.7改为0.4，数值越小越透明 */
            background-color: rgba(255, 255, 255, 0.4);
            padding: 30px 20px;
            border-radius: 12px;
            backdrop-filter: blur(3px); /* 保留背景模糊，增强分层感 */
        }
        /* 标题样式优化，适配透明背景 */
        #text::first-line {
            font-size: 32px;
            font-weight: bold;
            margin: 30px 0;
            display: block;
            color: #1a365d;
            text-shadow: 0 0 2px rgba(255,255,255,0.9);
        }
        /* 以下样式不变 */
        #text::after {
            content: "|"; 
            color: #e74c3c; 
            animation: blink 0.8s infinite alternate; 
            margin-left: 5px; 
        }
        @keyframes blink {
            from { opacity: 1; } 
            to { opacity: 0; } 
        }
        a{
            display:none;
            position:fixed;
            right:0;
            bottom:0;
            margin:10px;
            font-size:20px;
            color: #e74c3c;
            text-decoration: none; 
        }
        a:hover{
            text-decoration:underline;
        }
        .bottom-jump-btn {
            display: block;
            opacity: 0;
            transition: all 0.3s ease;
            position: fixed;
            right: 30px; 
            bottom: 30px; 
            padding: 12px 24px; 
            background-color: #ffffff;
            color: #1a365d;
            border: 3px solid #1a365d;
            box-shadow: 0 0 0 2px #0f2447;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer; 
            font-weight: bold;
            -webkit-text-stroke: 1px #0f2447;
            transform-origin: center;
            z-index: 999;
        }
        .bottom-jump-btn:hover {
            background-color: #f5f5f5; 
            border-color: #0f2447;
            box-shadow: 0 0 0 2px #08182e;
            transform: translateY(-2px);
        }
        .bottom-jump-btn.clicked {
            animation: btnClick 0.5s forwards;
        }
        @keyframes btnClick {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="content-wrapper">
        <div id="text"></div>
    </div>
    <button class="bottom-jump-btn">继续</button>
    <a ></a >
    <script>
        var text = '角色故事\n'+
                   '你是麦克白的妻子，君主的臣妇。邓肯王是到你家做客的尊贵客人。你有着极强的权力欲和控制欲，以及想成为皇后的野心。你认为麦克白“过于软弱”，需要你的推动。是你给侍卫下了药。在麦克白杀人后惊慌失措时，是你冷静地将匕首送回现场并栽赃给侍卫。你的华服袖口沾染了国王的血迹。\n\n'+

					
					'游戏开始时\n'+
					'麦克德夫作为礼仪官，同麦克白前去唤醒国王，发现其遇害，叫声唤醒众人。邓肯国王死于床上，两名侍卫昏迷在身边，其中一人手中握着带血的匕首，其中一名侍卫恰好开始苏醒，并发出了无意识的呻吟声，随即被盛怒的麦克白以“正义复仇”之名果断“处决”，灭口。在被“处决”的侍卫甲的尸体上，发现一枚带有法夫家族（麦克德夫家族）徽记的银戒指。该侍卫出身卑微，拥有此物极不寻常...';

        
        var t = document.getElementById("text");
        var btn = document.querySelector("a");
        var loginBtn = document.querySelector('.bottom-jump-btn');
        var index = 0;
        function Writer() {
            if (index < text.length) {
                t.innerHTML += text[index++];
                setTimeout(Writer, 120);
            } else {
                t.style.animation = "none"; 
                const cursor = document.createElement('style');
                cursor.textContent = "#text::after { display: none; }";
                document.head.appendChild(cursor); 
                btn.style.display = "block";
                loginBtn.style.opacity = 1;
            }
        }
        Writer();
        const jumpBtn = document.querySelector('.bottom-jump-btn');
        jumpBtn.addEventListener('click', function() {
            this.classList.add('clicked');
            setTimeout(()=>{
                window.location.href = '麦克白夫人体验.html';
            },500);
        });
    </script>
</body>
</html>
