<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麦克白背景介绍</title>
    <style>
        body{
            background:url(img/背景图-1.jpg);
            font-family:"楷体";
            font-size:25px;
            padding: 40px 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        #content-wrapper {
            width: 100%;
            max-width: 800px;
        }
        /* 核心修改：将透明度从0.7降至0.4，容器更通透 */
        #text{
            color: #1a1a1a;
            text-shadow: 0 0 3px rgba(255,255,255,1); /* 增强文字阴影，确保在透明背景上清晰 */
            line-height: 1.8;
            margin-bottom: 80px;
            text-align: center;
            white-space: pre-line;
            /* 透明度调整：rgba最后一位从0.7改为0.4，数值越小越透明 */
            background-color: rgba(255, 255, 255, 0.4);
            padding: 30px 20px;
            border-radius: 12px;
            backdrop-filter: blur(3px); /* 保留背景模糊，增强分层感 */
        }
        /* 标题样式优化，适配透明背景 */
        #text::first-line {
            font-size: 32px;
            font-weight: bold;
            margin: 30px 0;
            display: block;
            color: #1a365d;
            text-shadow: 0 0 2px rgba(255,255,255,0.9);
        }
        /* 以下样式不变 */
        #text::after {
            content: "|"; 
            color: #e74c3c; 
            animation: blink 0.8s infinite alternate; 
            margin-left: 5px; 
        }
        @keyframes blink {
            from { opacity: 1; } 
            to { opacity: 0; } 
        }
        a{
            display:none;
            position:fixed;
            right:0;
            bottom:0;
            margin:10px;
            font-size:20px;
            color: #e74c3c;
            text-decoration: none; 
        }
        a:hover{
            text-decoration:underline;
        }
        .bottom-jump-btn {
            display: block;
            opacity: 0;
            transition: all 0.3s ease;
            position: fixed;
            right: 30px; 
            bottom: 30px; 
            padding: 12px 24px; 
            background-color: #ffffff;
            color: #1a365d;
            border: 3px solid #1a365d;
            box-shadow: 0 0 0 2px #0f2447;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer; 
            font-weight: bold;
            -webkit-text-stroke: 1px #0f2447;
            transform-origin: center;
            z-index: 999;
        }
        .bottom-jump-btn:hover {
            background-color: #f5f5f5; 
            border-color: #0f2447;
            box-shadow: 0 0 0 2px #08182e;
            transform: translateY(-2px);
        }
        .bottom-jump-btn.clicked {
            animation: btnClick 0.5s forwards;
        }
        @keyframes btnClick {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="content-wrapper">
        <div id="text"></div>
    </div>
    <button class="bottom-jump-btn">继续</button>
    <a ></a >
    <script>
        var text = '角色故事\n'+
                   '你是战功赫赫的英雄，邓肯王的表亲，你深得宠信，不久前被赐予“考特爵士”的荣誉。'+
					'女巫的预言唤起了你对王位的渴望，但真正促使你动手的，是一封匿密的信报，其内容直指邓肯王已对你心生忌惮。你意识到，不抓住这个机会动手，就将失去一切。'+
					'班柯是你的战友，也是你命运的镜像。你们共享了女巫的预言，你相信他内心同样渴望其实现。你利用这一点，在行动前曾隐晦地寻求他的“理解”而非“帮助”，而他当时的沉默，被你视作了默许。现在，你需要牢牢绑住他。'+
					
					'你和夫人共同策划并实施了谋杀。迷晕侍卫后，你亲手用涂有毒药的匕首刺死了国王。'+
					'夫人帮助你伪造了现场，将凶器塞给了被迷晕的侍卫。'+
					
					'你是本案的凶手，你需要表现得像个悲愤的英雄，将所有嫌疑引向他人。你是唯一知道麦克白夫人全部罪行的人。\n\n'+
					
										
					'游戏开始时\n'+
					'麦克德夫作为礼仪官，同你前去唤醒国王，发现其遇害，叫声唤醒众人。邓肯国王死于床上，两名侍卫昏迷在身边，其中一人手中握着带血的匕首，其中一名侍卫恰好开始苏醒，并发出了无意识的呻吟声，你情急之下以“正义复仇”之名果断“处决”，灭口...';

        
        var t = document.getElementById("text");
        var btn = document.querySelector("a");
        var loginBtn = document.querySelector('.bottom-jump-btn');
        var index = 0;
        function Writer() {
            if (index < text.length) {
                t.innerHTML += text[index++];
                setTimeout(Writer, 120);
            } else {
                t.style.animation = "none"; 
                const cursor = document.createElement('style');
                cursor.textContent = "#text::after { display: none; }";
                document.head.appendChild(cursor); 
                btn.style.display = "block";
                loginBtn.style.opacity = 1;
            }
        }
        Writer();
        const jumpBtn = document.querySelector('.bottom-jump-btn');
        jumpBtn.addEventListener('click', function() {
            this.classList.add('clicked');
            setTimeout(()=>{
                window.location.href = '麦克白体验.html';
            },500);
        });
    </script>
</body>
</html>
